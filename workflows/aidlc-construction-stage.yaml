name: aidlc-construction-stage-hotl
initial_step: draft
max_steps: 8
steps:
  - name: draft
    session_key: stage-author
    edit: false
    instruction: |
      input/stage-context.jsonと注入された原文を使い、現在の工程の成果物を応答してください。
      必須ファイルをartifactsに入れ、各Markdownには2つ以上のH2を置きます。traceability.jsonが必要ならstage、upstream_ids、coverage[{id,status:"OK",target:"本家センサーが求める対応先"}]を含めてください。Functional Designはrules.mdに実在するBRx.yをtargetへ記載し、派生ルールの孤立も解消します。上流IDはinput/stage-context.jsonのrequirementIdsを使い、NFR Requirementsでは要求文書にNFRx.yの詳細IDを付与し、NFR Design以降も対応する本文にそのIDを引き継ぎます。
      upstreamにはupstreamArtifactsを全部列挙し、appliedRulesで本家の工程定義への対応を示します。
      ファイルは直接変更しません。CI工程だけはpipelinePathsの各ファイルの内容をwritesへ入れます。その他の工程のwritesは空です。
      規約・要求の矛盾や未決事項を推測せず、解決不能ならblockedと理由を返します。対話承認・ネイティブの状態更新・監査記録は行いません。
      Build and Testでは全UnitのCG成果物と検証結果を読み、品質目標の一覧・検証方法・実測の根拠・Unit間の要求対応をまとめます。検証未実行の場合は成功と捏造せず、検証ゲートが実行する計画と期待結果を示します。
      差し戻し時はレポートの指摘とinput/phase-checks.jsonがあればその失敗を修正してください。
      Build and Testの実測失敗がアプリ修正を必要とする場合は、verdictをrepair_requiredとし、repairUnitにinputのunitsから所有Unit名、reasonに失敗根拠を返してください。コントローラーがそのUnitの共通CGへ一度だけ戻します。
    output_contracts:
      report:
        - name: 01-stage.json
          format: |
            JSONのみ、文章は日本語。
            {"verdict":"ready または blocked または repair_required","repairUnit":"修正するUnit","reason":"停止理由","artifacts":{"ファイル名.md":"Markdown本文"},"writes":{},"upstream":["上流成果物の元パス"],"appliedRules":[{"source":"現在の工程定義の元パス","rule":"規則","application":"適用方法"}]}
    quality_gates:
      - type: command
        command: bun ../control/stage-gate.ts draft
        timeout_ms: 250000
    rules:
      - condition: 成果物がready
        next: review
      - condition: 解決不能でblocked
        next: ABORT
      - condition: 全体検証の失敗によりrepair_required
        next: ABORT
  - name: review
    session_key: stage-reviewer
    edit: false
    instruction: |
      次の成果物を、Intent、入力、注入された現在の工程定義・規約・センサーと照合して技術レビューしてください。
      {report:01-stage.json}
      input/stage-outputの実ファイルも確認します。Build and Test/CIではinput/phase-checks.jsonの実測値を確認し、未検証の品質目標やUnit間の要求漏れを成功と扱わないでください。
      設計の不備はchanges_requested、入力の矛盾等で自律的に決められなければblocked、全て満たしていればapprovedです。ファイル変更や対話承認は行いません。
    output_contracts:
      report:
        - name: 02-stage-review.json
          format: |
            JSONのみ、文章は日本語。
            {"verdict":"approved または changes_requested または blocked","reason":"停止理由","findings":[],"alignment":{"intent":"要求への対応","stageDefinition":"本家工程への対応","conventions":"規約への対応","testingContract":"品質目標と検証への対応"}}
            approvedではfindingsを空にします。
    quality_gates:
      - type: command
        command: bun ../control/stage-gate.ts review
        timeout_ms: 130000
    rules:
      - condition: レビューがapproved
        next: COMPLETE
      - condition: レビューがchanges_requested
        next: draft
      - condition: レビューがblocked
        next: ABORT
