name: aidlc-construction
description: 承認済みInceptionから詳細設計・独立レビュー・実装・修正・機械検証を行う。
max_steps: 18
initial_step: design
policies:
  evidence: ../facets/policies/evidence.md
  legacy-execution: ../facets/policies/legacy-execution.md
knowledge:
  inputs: ../facets/knowledge/frozen-inputs.md
instructions:
  legacy-design: ../facets/instructions/legacy-design.md
  legacy-design-review: ../facets/instructions/legacy-design-review.md
  legacy-implement: ../facets/instructions/legacy-implement.md
  legacy-code-review: ../facets/instructions/legacy-code-review.md
  legacy-fix: ../facets/instructions/legacy-fix.md
  legacy-finish: ../facets/instructions/legacy-finish.md
report_formats:
  legacy-design: ../facets/output-contracts/legacy-design.md
  legacy-design-review: ../facets/output-contracts/legacy-design-review.md
  legacy-code-review: ../facets/output-contracts/legacy-code-review.md
  legacy-finish: ../facets/output-contracts/legacy-finish.md
steps:
  - name: design
    session_key: construction-designer
    edit: false
    persona: planner
    policy:
      - evidence
      - legacy-execution
    knowledge:
      - inputs
    instruction: legacy-design
    output_contracts:
      report:
        - name: 01-design.json
          format: legacy-design
    quality_gates:
      - type: command
        name: design-contract
        command: bun ../control/construction-gate.ts design
        timeout_ms: 35000
    rules:
      - condition: 設計がreadyで承認済み要件内に収まる
        next: design-review
      - condition: 人間の回答が必要（needs_input）
        next: ABORT
  - name: design-review
    session_key: construction-design-reviewer
    edit: false
    persona: architecture-reviewer
    policy:
      - evidence
      - legacy-execution
    knowledge:
      - inputs
    instruction: legacy-design-review
    output_contracts:
      report:
        - name: 02-design-review.json
          format: legacy-design-review
    quality_gates:
      - type: command
        name: design-review-contract
        command: bun ../control/construction-gate.ts design-review
        timeout_ms: 35000
    rules:
      - condition: 設計レビューがapproved
        next: implement
      - condition: 設計レビューがchanges_requested
        next: design
      - condition: 人間の回答が必要（needs_input）
        next: ABORT
  - name: implement
    session_key: construction-implementer
    edit: true
    required_permission_mode: edit
    persona: coder
    policy:
      - evidence
      - legacy-execution
    knowledge:
      - inputs
    instruction: legacy-implement
    quality_gates:
      - type: command
        name: acceptance-tests
        command: bun ../control/construction-gate.ts implement
        timeout_ms: 35000
    rules:
      - condition: 実装とテストの作成が完了
        next: code-review
      - condition: 承認済みの範囲では解決できない（blocked）
        next: ABORT
  - name: code-review
    session_key: construction-code-reviewer
    edit: false
    persona: coding-reviewer
    policy:
      - evidence
      - legacy-execution
    knowledge:
      - inputs
    instruction: legacy-code-review
    output_contracts:
      report:
        - name: 03-code-review.json
          format: legacy-code-review
    quality_gates:
      - type: command
        name: reviewed-source
        command: bun ../control/construction-gate.ts code-review
        timeout_ms: 35000
    rules:
      - condition: コードレビューがapproved
        next: finish
      - condition: コードレビューがchanges_requested
        next: fix
      - condition: 人間の回答が必要（needs_input）
        next: ABORT
  - name: fix
    session_key: construction-implementer
    edit: true
    required_permission_mode: edit
    persona: coder
    policy:
      - evidence
      - legacy-execution
    knowledge:
      - inputs
    instruction: legacy-fix
    quality_gates:
      - type: command
        name: regression-tests
        command: bun ../control/construction-gate.ts fix
        timeout_ms: 35000
    rules:
      - condition: 指摘の修正とテストの更新が完了
        next: code-review
      - condition: 承認済みの範囲では解決できない（blocked）
        next: ABORT
  - name: finish
    session_key: construction-reporter
    edit: false
    persona: exec-assistant
    policy:
      - evidence
      - legacy-execution
    knowledge:
      - inputs
    instruction: legacy-finish
    output_contracts:
      report:
        - name: 04-handoff.json
          format: legacy-finish
    quality_gates:
      - type: command
        name: final-evidence
        command: bun ../control/construction-gate.ts finish
        timeout_ms: 35000
    rules:
      - condition: 受け渡し報告が完了
        next: COMPLETE
