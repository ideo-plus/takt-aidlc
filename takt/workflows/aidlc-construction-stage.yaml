name: aidlc-construction-stage-hotl
initial_step: draft
max_steps: 8
policies:
  evidence: ../facets/policies/evidence.md
  stage-hotl: ../facets/policies/stage-hotl.md
knowledge:
  inputs: ../facets/knowledge/frozen-inputs.md
  stage-artifacts: ../facets/knowledge/stage-artifacts.md
instructions:
  stage-draft: ../facets/instructions/stage-draft.md
  stage-review: ../facets/instructions/stage-review.md
report_formats:
  stage-draft: ../facets/output-contracts/stage-draft.md
  stage-review: ../facets/output-contracts/stage-review.md
steps:
  - name: draft
    session_key: stage-author
    edit: false
    persona: planner
    policy:
      - evidence
      - stage-hotl
    knowledge:
      - inputs
      - stage-artifacts
    instruction: stage-draft
    output_contracts:
      report:
        - name: 01-stage.json
          format: stage-draft
    quality_gates:
      - type: command
        command: bun ../control/stage-gate.ts draft
        timeout_ms: 250000
    rules:
      - condition: 成果物がready
        next: review
      - condition: 解決不能でblocked
        next: ABORT
      - condition: 全体検証の失敗によりrepair_required
        next: ABORT
  - name: review
    session_key: stage-reviewer
    edit: false
    persona: architecture-reviewer
    policy:
      - evidence
      - stage-hotl
    knowledge:
      - inputs
      - stage-artifacts
    instruction: stage-review
    output_contracts:
      report:
        - name: 02-stage-review.json
          format: stage-review
    quality_gates:
      - type: command
        command: bun ../control/stage-gate.ts review
        timeout_ms: 130000
    rules:
      - condition: レビューがapproved
        next: COMPLETE
      - condition: レビューがchanges_requested
        next: draft
      - condition: レビューがblocked
        next: ABORT
