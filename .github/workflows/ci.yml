name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - name: Install pinned CLIs
        env:
          AIDLC_BIN_DIR: ${{ runner.temp }}/aidlc-bin
          AIDLC_INSTALL_ROOT: ${{ runner.temp }}/aidlc-data
        run: |
          curl --fail --silent --show-error --location https://github.com/awslabs/aidlc-workflows/releases/download/v2.8.2/install.sh --output "$RUNNER_TEMP/install-aidlc.sh"
          sh "$RUNNER_TEMP/install-aidlc.sh" --version 2.8.2 --yes
          echo "$AIDLC_BIN_DIR" >> "$GITHUB_PATH"
          npm install --global takt@0.65.0 @anthropic-ai/claude-code@2.1.270
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Test without model credentials
        run: bun run test
      - run: bun run build:plugin
      - run: claude plugin validate dist/claude
