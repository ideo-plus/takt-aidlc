name: aidlc-code-generation-hotl
description: 本家AI-DLCのCG定義・Intent・知識・センサーを入力とする、対話承認なしのCG単体。
initial_step: plan
max_steps: 20
personas:
  planner: ../facets/personas/planner.md
  reviewer: ../facets/personas/reviewer.md
  developer: ../facets/personas/developer.md
  reporter: ../facets/personas/reporter.md
policies:
  evidence: ../facets/policies/evidence.md
  cg-hotl: ../facets/policies/cg-hotl.md
knowledge:
  inputs: ../facets/knowledge/frozen-inputs.md
  cg-artifacts: ../facets/knowledge/cg-artifacts.md
instructions:
  cg-plan: ../facets/instructions/cg-plan.md
  cg-plan-review: ../facets/instructions/cg-plan-review.md
  cg-implement: ../facets/instructions/cg-implement.md
  cg-code-review: ../facets/instructions/cg-code-review.md
  cg-fix: ../facets/instructions/cg-fix.md
  cg-finish: ../facets/instructions/cg-finish.md
report_formats:
  cg-plan: ../facets/output-contracts/cg-plan.md
  cg-plan-review: ../facets/output-contracts/cg-plan-review.md
  cg-code-review: ../facets/output-contracts/cg-code-review.md
  cg-finish: ../facets/output-contracts/cg-finish.md
steps:
  - name: plan
    session_key: cg-planner
    edit: false
    persona: planner
    policy:
      - evidence
      - cg-hotl
    knowledge:
      - inputs
      - cg-artifacts
    instruction: cg-plan
    output_contracts:
      report:
        - name: 01-cg-plan.json
          format: cg-plan
    quality_gates:
      - type: command
        command: bun ../control/cg-gate.ts plan
        timeout_ms: 130000
    rules:
      - condition: CG計画がready
        next: plan-review
      - condition: CG計画がblocked
        next: ABORT
  - name: plan-review
    session_key: cg-plan-reviewer
    edit: false
    persona: reviewer
    policy:
      - evidence
      - cg-hotl
    knowledge:
      - inputs
      - cg-artifacts
    instruction: cg-plan-review
    output_contracts:
      report:
        - name: 02-plan-review.json
          format: cg-plan-review
    quality_gates:
      - type: command
        command: bun ../control/cg-gate.ts plan-review
        timeout_ms: 130000
    rules:
      - condition: 計画レビューがapproved
        next: implement
      - condition: 計画レビューがchanges_requested
        next: plan
      - condition: 計画レビューがblocked
        next: ABORT
  - name: implement
    session_key: cg-developer
    edit: true
    required_permission_mode: edit
    persona: developer
    policy:
      - evidence
      - cg-hotl
    knowledge:
      - inputs
      - cg-artifacts
    instruction: cg-implement
    quality_gates:
      - type: command
        command: bun ../control/cg-gate.ts implement
        timeout_ms: 250000
    rules:
      - condition: 実装とCG成果物の記録が完了
        next: code-review
      - condition: 自律的に解決できずblocked
        next: ABORT
  - name: code-review
    session_key: cg-code-reviewer
    edit: false
    persona: reviewer
    policy:
      - evidence
      - cg-hotl
    knowledge:
      - inputs
      - cg-artifacts
    instruction: cg-code-review
    output_contracts:
      report:
        - name: 03-code-review.json
          format: cg-code-review
    quality_gates:
      - type: command
        command: bun ../control/cg-gate.ts code-review
        timeout_ms: 130000
    rules:
      - condition: コードレビューがapproved
        next: finish
      - condition: コードレビューがchanges_requested
        next: fix
      - condition: コードレビューがblocked
        next: ABORT
  - name: fix
    session_key: cg-developer
    edit: true
    required_permission_mode: edit
    persona: developer
    policy:
      - evidence
      - cg-hotl
    knowledge:
      - inputs
      - cg-artifacts
    instruction: cg-fix
    quality_gates:
      - type: command
        command: bun ../control/cg-gate.ts fix
        timeout_ms: 250000
    rules:
      - condition: 修正とCG成果物の更新が完了
        next: code-review
      - condition: 自律的に解決できずblocked
        next: ABORT
  - name: finish
    session_key: cg-reporter
    edit: false
    persona: reporter
    policy:
      - evidence
      - cg-hotl
    knowledge:
      - inputs
      - cg-artifacts
    instruction: cg-finish
    output_contracts:
      report:
        - name: 04-cg-summary.json
          format: cg-finish
    quality_gates:
      - type: command
        command: bun ../control/cg-gate.ts finish
        timeout_ms: 130000
    rules:
      - condition: CGの完了報告が完成
        next: COMPLETE
